<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reasons Why I Love You, Recel Busilak B. Perez</title>
  <style>
    :root {
      --bg-1: #ffd9e8;
      --bg-2: #ffc5db;
      --bg-3: #ffe9f1;
      --bg-4: #f9c5d5;
      --rose: #ff4f86;
      --rose-dark: #d73767;
      --text-main: #4d2b39;
      --text-soft: #7f5164;
      --glass: rgba(255, 255, 255, 0.35);
      --glass-border: rgba(255, 255, 255, 0.45);
      --shadow: 0 12px 30px rgba(137, 42, 76, 0.18);
    }

    * {
      box-sizing: border-box;
      cursor: none;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
      color: var(--text-main);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-4));
      background-size: 400% 400%;
      animation: dreamyGradient 24s ease infinite;
      position: relative;
      padding: 28px 14px;
    }

    /* Soft ambient glow behind content */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 38vmax;
      height: 38vmax;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background: #ff8db4;
      top: -10vmax;
      left: -8vmax;
      animation: floatBlob 18s ease-in-out infinite;
    }

    body::after {
      background: #ffd6e7;
      bottom: -10vmax;
      right: -8vmax;
      animation: floatBlob 22s ease-in-out infinite reverse;
    }

    .page {
      width: min(780px, 95vw);
      text-align: center;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    h1 {
      margin: 0;
      line-height: 1.15;
      letter-spacing: 0.3px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-family: "Georgia", "Times New Roman", serif;
      color: #7a2448;
      text-shadow: 0 8px 24px rgba(171, 52, 98, 0.26);
    }

    .love-button {
      border: 0;
      outline: none;
      margin-top: 6px;
      color: #ffffff;
      font-weight: 700;
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      letter-spacing: 0.2px;
      padding: 16px 34px;
      border-radius: 999px;
      background: linear-gradient(120deg, var(--rose), #ff7fa6);
      box-shadow: 0 10px 24px rgba(212, 61, 111, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
      animation: pulse 2.5s ease-in-out infinite;
    }

    .love-button:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 14px 32px rgba(212, 61, 111, 0.58);
      filter: brightness(1.06);
    }

    .love-button:active {
      transform: translateY(0) scale(0.98);
    }

    .love-button:disabled {
      background: linear-gradient(120deg, #d5a8b8, #c997ab);
      box-shadow: 0 8px 18px rgba(120, 63, 85, 0.22);
      animation: none;
    }

    .music-panel {
      width: min(700px, 95vw);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
      border-radius: 18px;
      backdrop-filter: blur(8px);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .music-toggle {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.2px;
      background: linear-gradient(120deg, var(--rose), #ff7fa6);
      box-shadow: 0 8px 18px rgba(212, 61, 111, 0.33);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .music-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 22px rgba(212, 61, 111, 0.45);
    }

    .music-volume-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 190px;
      color: var(--text-soft);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .music-volume {
      width: 100%;
      accent-color: #ff5a91;
    }

    .memory-counter {
      width: min(700px, 95vw);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 4px;
    }

    .memory-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
      border-radius: 18px;
      backdrop-filter: blur(8px);
      padding: 12px 14px;
      text-align: left;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .memory-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 28px rgba(137, 42, 76, 0.22);
    }

    .memory-title {
      margin: 0 0 5px;
      font-size: 0.9rem;
      color: var(--text-soft);
      letter-spacing: 0.2px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .memory-days {
      margin: 0;
      font-size: clamp(1.15rem, 2.8vw, 1.55rem);
      font-weight: 800;
      color: #7a2448;
      font-family: "Georgia", "Times New Roman", serif;
    }

    .memory-date {
      margin: 2px 0 0;
      font-size: 0.86rem;
      color: var(--text-soft);
    }

    .envelope-surprise {
      width: min(700px, 95vw);
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .envelope-trigger {
      border: 0;
      background: transparent;
      padding: 0;
      cursor: none;
    }

    .envelope {
      position: relative;
      width: min(280px, 70vw);
      height: 180px;
      perspective: 1000px;
      filter: drop-shadow(0 14px 20px rgba(120, 40, 72, 0.26));
      transition: transform 0.35s ease;
    }

    .envelope-trigger:hover .envelope {
      transform: translateY(-4px);
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(145deg, #ffc0d8, #ffabc9);
      border: 1px solid rgba(255, 255, 255, 0.55);
      overflow: hidden;
    }

    .envelope-front {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56%;
      background: linear-gradient(160deg, #ff9fc2, #ff8eb6);
      clip-path: polygon(0 0, 50% 44%, 100% 0, 100% 100%, 0 100%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 3;
    }

    .envelope-flap {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 58%;
      transform-origin: top;
      transform: rotateX(0deg);
      transition: transform 0.75s cubic-bezier(0.22, 0.61, 0.36, 1);
      background: linear-gradient(160deg, #ff85b0, #ff6e9f);
      clip-path: polygon(0 0, 50% 70%, 100% 0, 100% 100%, 0 100%);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      z-index: 4;
      backface-visibility: hidden;
    }

    .envelope-letter {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%) translateY(0);
      width: 84%;
      min-height: 58%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 12px 12px 10px;
      color: #7a2448;
      font-size: 0.92rem;
      line-height: 1.42;
      text-align: center;
      z-index: 2;
      opacity: 0;
      box-shadow: 0 8px 16px rgba(118, 36, 70, 0.12);
      transition: transform 0.75s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.3s ease;
    }

    .envelope-hint {
      margin: 0;
      font-size: 0.92rem;
      color: var(--text-soft);
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .envelope-surprise.open .envelope-flap {
      transform: rotateX(170deg);
    }

    .envelope-surprise.open .envelope-letter {
      opacity: 1;
      z-index: 6;
      transform: translateX(-50%) translateY(-100px);
    }

    .floating-hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .floating-heart {
      position: absolute;
      bottom: -12vh;
      left: var(--left, 50%);
      font-size: var(--size, 16px);
      color: rgba(255, 95, 146, 0.26);
      animation: heartFloat var(--duration, 18s) linear infinite;
      animation-delay: var(--delay, 0s);
      filter: blur(0.2px);
      user-select: none;
    }

    .reasons {
      width: min(700px, 95vw);
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .reason-card {
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      border-radius: 22px;
      padding: 16px 20px;
      text-align: left;
      color: var(--text-main);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      transition: transform 0.28s ease, box-shadow 0.28s ease;
    }

    .reason-card.show {
      animation: cardIn 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    .reason-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 34px rgba(137, 42, 76, 0.24);
    }

    .reason-text {
      margin: 0;
      font-size: clamp(1rem, 2.1vw, 1.1rem);
      color: var(--text-main);
      line-height: 1.45;
    }

    .final-message {
      margin-top: 8px;
      font-size: clamp(1.7rem, 4.8vw, 3rem);
      font-family: "Georgia", "Times New Roman", serif;
      color: #fff7fb;
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.7),
        0 0 20px rgba(255, 173, 204, 0.85),
        0 0 34px rgba(255, 115, 165, 0.75);
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.85s ease, transform 0.85s ease;
    }

    .final-message.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: glowPulse 1.9s ease-in-out infinite;
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }

    .confetti {
      position: fixed;
      top: -12vh;
      left: 50%;
      width: var(--size, 9px);
      height: calc(var(--size, 9px) * 1.5);
      border-radius: 2px;
      opacity: 0.95;
      animation: confettiDrop var(--fall, 3.8s) linear forwards;
      will-change: transform, opacity;
    }

    .heart-cursor {
      position: fixed;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 50;
      font-size: 16px;
      color: #ff477e;
      text-shadow: 0 0 12px rgba(255, 112, 158, 0.65);
      transition: transform 0.06s linear;
      user-select: none;
    }

    .click-heart {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 40;
      font-size: 14px;
      color: #ff4f86;
      text-shadow: 0 0 8px rgba(255, 135, 172, 0.75);
      animation: heartBurst 0.85s ease-out forwards;
      will-change: transform, opacity;
      user-select: none;
    }

    @keyframes dreamyGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatBlob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(12px, -18px) scale(1.06); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    @keyframes cardIn {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes glowPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.08); }
    }

    @keyframes confettiDrop {
      0% {
        transform: translate3d(0, -12vh, 0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translate3d(var(--drift, 0px), 112vh, 0) rotate(760deg);
        opacity: 1;
      }
    }

    @keyframes heartBurst {
      0% {
        opacity: 0.98;
        transform: translate(-50%, -50%) scale(0.7);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x, 0px)), calc(-50% + var(--y, -30px))) scale(1.45);
      }
    }

    @keyframes heartFloat {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      50% {
        transform: translate3d(var(--drift, 22px), -56vh, 0) rotate(10deg);
      }
      100% {
        transform: translate3d(calc(var(--drift, 22px) * -1), -120vh, 0) rotate(-10deg);
        opacity: 0;
      }
    }

    @media (max-width: 640px) {
      .page {
        gap: 14px;
      }

      .music-panel {
        flex-direction: column;
        align-items: stretch;
      }

      .memory-counter {
        grid-template-columns: 1fr;
      }

      .reason-card {
        padding: 14px 16px;
      }

      .love-button {
        padding: 14px 24px;
      }

      .envelope-surprise.open .envelope-letter {
        transform: translateX(-50%) translateY(-88px);
      }
    }
  </style>
</head>
<body>
  <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

  <main class="page">
    <h1>Reasons Why I Love You, Recel Busilak B. Perez ❤️</h1>

    <button class="love-button" id="loveButton" type="button">
      Click to See Why I Love You
    </button>

    <section class="music-panel" aria-label="Music controls">
      <button class="music-toggle" id="musicToggle" type="button">Play Our Song ♪</button>
      <label class="music-volume-wrap" for="musicVolume">
        Volume
        <input class="music-volume" id="musicVolume" type="range" min="0" max="100" value="55" />
      </label>
    </section>

    <section class="memory-counter" aria-label="Relationship counters">
      <article class="memory-card">
        <p class="memory-title">We've Known Each Other For</p>
        <p class="memory-days" id="knownDays">0 days</p>
        <p class="memory-date">Since April 1, 2025</p>
      </article>
      <article class="memory-card">
        <p class="memory-title">We've Been Together For</p>
        <p class="memory-days" id="togetherDays">0 days</p>
        <p class="memory-date">Since July 8, 2025</p>
      </article>
    </section>

    <section class="envelope-surprise" id="envelopeSurprise">
      <button class="envelope-trigger" id="envelopeTrigger" type="button" aria-expanded="false" aria-controls="secretMessage">
        <div class="envelope">
          <div class="envelope-back"></div>
          <div class="envelope-letter" id="secretMessage">
            Loving you is the easiest and most beautiful part of my life. Thank you for being my home, my peace, and my forever favorite person.
          </div>
          <div class="envelope-flap"></div>
          <div class="envelope-front"></div>
        </div>
      </button>
      <p class="envelope-hint">Tap the envelope for a secret message</p>
    </section>

    <section class="reasons" id="reasonsContainer" aria-live="polite"></section>

    <div class="final-message" id="finalMessage">You Are My Everything, Recel Busilak B. Perez ❤️</div>
  </main>

  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  <div class="heart-cursor" id="heartCursor" aria-hidden="true">❤</div>
  <audio id="bgMusic" src="To The Bone.mp3" preload="metadata" loop></audio>

  <script>
    // Editable list of love reasons.
    const reasons = [
      "Your smile makes my worst days better.",
      "You understand me like no one else.",
      "You make life feel exciting.",
      "You support my dreams.",
      "You are my peace.",
      "You are my best friend.",
      "You make everything brighter.",
      "You are my favorite person.",
      "You make me feel loved every day.",
      "I simply can't imagine life without you."
    ];

    const loveButton = document.getElementById("loveButton");
    const reasonsContainer = document.getElementById("reasonsContainer");
    const finalMessage = document.getElementById("finalMessage");
    const confettiLayer = document.getElementById("confettiLayer");
    const heartCursor = document.getElementById("heartCursor");
    const knownDays = document.getElementById("knownDays");
    const togetherDays = document.getElementById("togetherDays");
    const musicToggle = document.getElementById("musicToggle");
    const musicVolume = document.getElementById("musicVolume");
    const bgMusic = document.getElementById("bgMusic");
    const floatingHearts = document.getElementById("floatingHearts");
    const envelopeSurprise = document.getElementById("envelopeSurprise");
    const envelopeTrigger = document.getElementById("envelopeTrigger");

    let currentReasonIndex = 0;
    let finaleTriggered = false;

    // Memory timeline dates.
    const knownSinceDate = new Date("2025-04-01T00:00:00");
    const relationshipSinceDate = new Date("2025-07-08T00:00:00");

    function calculateDaysSince(startDate) {
      const now = new Date();
      const diffMs = now.getTime() - startDate.getTime();
      const safeDiff = Math.max(diffMs, 0);
      return Math.floor(safeDiff / (1000 * 60 * 60 * 24));
    }

    function updateMemoryCounters() {
      knownDays.textContent = `${calculateDaysSince(knownSinceDate)} days`;
      togetherDays.textContent = `${calculateDaysSince(relationshipSinceDate)} days`;
    }

    updateMemoryCounters();
    setInterval(updateMemoryCounters, 1000);

    bgMusic.volume = Number(musicVolume.value) / 100;

    musicToggle.addEventListener("click", async () => {
      if (bgMusic.paused) {
        try {
          await bgMusic.play();
          musicToggle.textContent = "Pause Our Song ❚❚";
        } catch (error) {
          musicToggle.textContent = "Tap Again To Play ♪";
        }
      } else {
        bgMusic.pause();
        musicToggle.textContent = "Play Our Song ♪";
      }
    });

    musicVolume.addEventListener("input", () => {
      bgMusic.volume = Number(musicVolume.value) / 100;
    });

    function createFloatingHearts() {
      const count = 20;
      for (let i = 0; i < count; i += 1) {
        const heart = document.createElement("span");
        heart.className = "floating-heart";
        heart.textContent = "❤";
        heart.style.setProperty("--left", `${Math.random() * 100}%`);
        heart.style.setProperty("--size", `${10 + Math.random() * 20}px`);
        heart.style.setProperty("--duration", `${14 + Math.random() * 16}s`);
        heart.style.setProperty("--delay", `${-Math.random() * 22}s`);
        heart.style.setProperty("--drift", `${10 + Math.random() * 34}px`);
        floatingHearts.appendChild(heart);
      }
    }

    createFloatingHearts();

    envelopeTrigger.addEventListener("click", () => {
      const isOpen = envelopeSurprise.classList.toggle("open");
      envelopeTrigger.setAttribute("aria-expanded", String(isOpen));
    });

    function addReasonCard(text) {
      const card = document.createElement("article");
      card.className = "reason-card";

      const paragraph = document.createElement("p");
      paragraph.className = "reason-text";
      paragraph.textContent = text;

      card.appendChild(paragraph);
      reasonsContainer.appendChild(card);

      requestAnimationFrame(() => {
        card.classList.add("show");
      });

      card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function launchConfetti() {
      const colors = [
        "#ff4f86",
        "#ff7faa",
        "#ffc2d8",
        "#ffddec",
        "#ffffff",
        "#f48fb1"
      ];

      const pieces = 170;
      for (let i = 0; i < pieces; i += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti";

        const left = Math.random() * 100;
        const size = 6 + Math.random() * 9;
        const drift = -120 + Math.random() * 240;
        const fall = 2.6 + Math.random() * 2.8;

        piece.style.left = `${left}vw`;
        piece.style.setProperty("--size", `${size}px`);
        piece.style.setProperty("--drift", `${drift}px`);
        piece.style.setProperty("--fall", `${fall}s`);
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];

        confettiLayer.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, fall * 1000 + 160);
      }
    }

    function showFinale() {
      if (finaleTriggered) {
        return;
      }

      finaleTriggered = true;
      launchConfetti();
      finalMessage.classList.add("show");
      loveButton.disabled = true;
      loveButton.textContent = "Forever & Always ❤️";
    }

    loveButton.addEventListener("click", () => {
      if (currentReasonIndex < reasons.length) {
        addReasonCard(reasons[currentReasonIndex]);
        currentReasonIndex += 1;

        if (currentReasonIndex === reasons.length) {
          setTimeout(showFinale, 350);
        }
      }
    });

    // Heart cursor follows pointer.
    window.addEventListener("mousemove", (event) => {
      heartCursor.style.left = `${event.clientX}px`;
      heartCursor.style.top = `${event.clientY}px`;
    });

    // Burst hearts on click.
    window.addEventListener("click", (event) => {
      const burstCount = 10;

      for (let i = 0; i < burstCount; i += 1) {
        const heart = document.createElement("span");
        heart.className = "click-heart";
        heart.textContent = "❤";

        const angle = (Math.PI * 2 * i) / burstCount;
        const distance = 24 + Math.random() * 34;
        const jitterX = (Math.random() - 0.5) * 14;
        const jitterY = (Math.random() - 0.5) * 14;

        const x = Math.cos(angle) * distance + jitterX;
        const y = Math.sin(angle) * distance + jitterY;

        heart.style.left = `${event.clientX}px`;
        heart.style.top = `${event.clientY}px`;
        heart.style.setProperty("--x", `${x}px`);
        heart.style.setProperty("--y", `${y}px`);

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 860);
      }
    });
  </script>
</body>
</html>
